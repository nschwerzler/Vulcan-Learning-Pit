name: User Story
description: Create a user story for new functionality
title: "[Story] "
labels: ["user-story", "scrum"]
body:
  - type: markdown
    attributes:
      value: |
        ## User Story Template
        Use this template to create user stories following the Scrum methodology.
        
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe the story from the user's perspective
      placeholder: |
        As a [type of user]
        I want [goal/desire]
        So that [benefit/value]
    validations:
      required: true
      
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met for this story to be considered complete
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Additional Details
      description: Provide any additional context, mockups, or technical details
      
  - type: dropdown
    id: story-points
    attributes:
      label: Story Points
      description: Estimated complexity (Fibonacci scale)
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
        - "Not estimated yet"
    validations:
      required: true
      
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Business priority of this story
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true
      
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any dependencies or blocked by items
      placeholder: |
        - Depends on #123
        - Blocked by external API
        
  - type: textarea
    id: notes
    attributes:
      label: Technical Notes
      description: Any technical considerations or implementation notes
