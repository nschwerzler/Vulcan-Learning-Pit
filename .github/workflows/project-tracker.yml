name: Project Tracker Automation

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
  pull_request:
    types:
      - opened
      - reopened

jobs:
  add-to-project-tracker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Add issue to Project Tracker
        if: github.event_name == 'issues'
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Add PR to Project Tracker
        if: github.event_name == 'pull_request'
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Label initiatives
        if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'initiative')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['epic']
            })
