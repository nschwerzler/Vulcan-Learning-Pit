name: Release with Checksums

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux-x64
            runtime: linux-x64
          - os: win-x64
            runtime: win-x64
          - os: osx-x64
            runtime: osx-x64
          - os: osx-arm64
            runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/VulcanLearningPit/VulcanLearningPit.csproj

      - name: Build and publish
        run: |
          dotnet publish src/VulcanLearningPit/VulcanLearningPit.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -o ./publish/${{ matrix.os }}

      - name: Create archive
        run: |
          cd ./publish/${{ matrix.os }}
          if [[ "${{ matrix.os }}" == win-* ]]; then
            zip -r ../../VulcanLearningPit-${{ matrix.os }}.zip .
          else
            tar -czf ../../VulcanLearningPit-${{ matrix.os }}.tar.gz .
          fi

      - name: Generate SHA256 checksum
        run: |
          if [[ "${{ matrix.os }}" == win-* ]]; then
            sha256sum VulcanLearningPit-${{ matrix.os }}.zip > VulcanLearningPit-${{ matrix.os }}.zip.sha256
          else
            sha256sum VulcanLearningPit-${{ matrix.os }}.tar.gz > VulcanLearningPit-${{ matrix.os }}.tar.gz.sha256
          fi

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: vulcan-learning-pit-${{ matrix.os }}
          path: |
            VulcanLearningPit-${{ matrix.os }}.*
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VulcanLearningPit-${{ matrix.os }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
