name: Add to Kanban Board

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue or PR to Kanban board
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          # TODO: Configure your project URL after creating the GitHub Project
          # Replace PROJECT_NUMBER with your actual project number
          # Example: https://github.com/users/USERNAME/projects/1
          # Or for organization: https://github.com/orgs/ORGNAME/projects/1
          project-url: https://github.com/users/nschwerzler/projects/1
          github-token: ${{ secrets.GITHUB_TOKEN }}
