name: Add to Kanban Board

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue or PR to Kanban board
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          # Project URL can be configured in repository settings
          # This is a placeholder workflow that demonstrates the concept
          github-token: ${{ secrets.GITHUB_TOKEN }}
