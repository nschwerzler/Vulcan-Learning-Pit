<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background for Vulcan aesthetic -->
  <rect width="256" height="256" fill="#1a1a2e" rx="32"/>
  
  <!-- Stylized Vulcan Hand (🖖) in teal/cyan - iconic Spock gesture -->
  <g transform="translate(128, 140)">
    <!-- Palm base -->
    <ellipse cx="0" cy="10" rx="35" ry="45" fill="#16f4d0" opacity="0.9"/>
    
    <!-- Index finger -->
    <rect x="-25" y="-70" width="18" height="75" rx="9" fill="#16f4d0" transform="rotate(-15 -16 -32.5)"/>
    
    <!-- Middle finger -->
    <rect x="-7" y="-80" width="18" height="85" rx="9" fill="#16f4d0"/>
    
    <!-- Ring finger -->
    <rect x="11" y="-75" width="18" height="80" rx="9" fill="#16f4d0" transform="rotate(15 20 -35)"/>
    
    <!-- Pinky -->
    <rect x="28" y="-60" width="16" height="65" rx="8" fill="#16f4d0" transform="rotate(25 36 -27.5)"/>
    
    <!-- Thumb -->
    <rect x="-45" y="-20" width="20" height="60" rx="10" fill="#16f4d0" transform="rotate(-70 -35 10)"/>
    
    <!-- Vulcan split between fingers (logic/emotion divide) -->
    <line x1="-2" y1="-75" x2="-2" y2="-20" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="-70" x2="16" y2="-15" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle "V" for Vulcan in top corner -->
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#16f4d0" opacity="0.7">V</text>
  
  <!-- Small circuit/logic pattern in bottom corner (representing logical learning) -->
  <g transform="translate(200, 210)" opacity="0.5">
    <circle cx="0" cy="0" r="3" fill="#16f4d0"/>
    <circle cx="12" cy="-8" r="3" fill="#16f4d0"/>
    <circle cx="12" cy="8" r="3" fill="#16f4d0"/>
    <line x1="0" y1="0" x2="12" y2="-8" stroke="#16f4d0" stroke-width="2"/>
    <line x1="0" y1="0" x2="12" y2="8" stroke="#16f4d0" stroke-width="2"/>
  </g>
</svg>
